# Bear Den stack — single Docker Compose project with one shared network (`bears-stack`).
#
# Recommended for Coolify: Add Resource → Docker Compose → this repository,
# Base Directory: `.` (repo root), Compose file: `docker-compose.yaml`.
#
# Default stack: `bears-bifrost`, `bears-den`, `bears-sandbox-provider` +
# `bears-sandbox-engine` (work sandboxes), optional `bears-postgres` (profile `bundled`).
# The Den-native in-process agent loop and per-Bear SQLite (`BEAR_SQLITE_DATA_DIR` /
# `bears-den-sqlite-data`) are the only runtime; Letta/Codepool/MemFS have been removed.
#
# PostgreSQL: set **`DATABASE_URL`** for `bears-den` (managed DB — preferred in Coolify).
# Optional bundled Den Postgres: `COMPOSE_PROFILES=bundled` then `docker compose --profile bundled up -d`.
#
# Shared-server deployments should use distinct service ports per environment
# (for example BIFROST_APP_PORT=8080 in prod and 8081 in test) and let Den derive
# all Bifrost URLs from that one port-derived origin.
#
# See docs/deployment/DEPLOYMENT.md and per-service COOLIFY_DEPLOY.md files.
#
# **Preflight** services run once at deploy time and validate config before other services start
# (`depends_on` + `service_completed_successfully`). Requires Docker Compose **v2.20+**.
# Run manually: `docker compose run --rm bears-preflight-config`.

# Production keeps the historic `bears-*` identities. Shared-network secondary
# deployments set BEARS_INSTANCE_SUFFIX (for example `-test`) so DNS names,
# project resources, and volumes cannot collide with production.
name: bears-stack${BEARS_INSTANCE_SUFFIX:-}

x-preflight-build: &preflight-build
    context: .
    dockerfile: services/preflight/Dockerfile

x-preflight-environment: &preflight-environment
    BIFROST_CONFIG_PATH: /app/bifrost/config.json
    BEARS_INSTANCE_SUFFIX: ${BEARS_INSTANCE_SUFFIX:-}
    JWT_SECRET: ${JWT_SECRET:-SETME}
    DEN_SECRET_ENCRYPTION_KEY: ${DEN_SECRET_ENCRYPTION_KEY:-SETME}
    BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-SETME}
    BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
    BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
    BIFROST_ORIGIN: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_INSTANCE_SUFFIX:-}:${BIFROST_APP_PORT:-8080}}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
    DATABASE_URL: ${DATABASE_URL:-SETME}
    WEB_SERVER_URL: ${WEB_SERVER_URL:-${SERVICE_URL_DEN:-SETME}}
    DEN_SEARCH_PROVIDER: ${DEN_SEARCH_PROVIDER:-}
    BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    DEN_SEARCH_MAX_RESULTS: ${DEN_SEARCH_MAX_RESULTS:-5}

x-preflight-depends: &preflight-depends
    bears-preflight-config:
        condition: service_completed_successfully
    bears-preflight-den-db:
        condition: service_completed_successfully

services:
    workspace:
        profiles:
            - dev
        build: .devcontainer
        volumes:
            - .:/workspace
            - /var/run/docker.sock:/var/run/docker.sock
        command: sleep infinity

    bears-preflight-config:
        build: *preflight-build
        restart: "no"
        command: ["config"]
        environment: *preflight-environment

    bears-preflight-den-db:
        build: *preflight-build
        restart: "no"
        depends_on:
            bears-postgres:
                condition: service_healthy
                required: false
        command: ["den-db"]
        environment: *preflight-environment

    bears-postgres:
        profiles:
            - bundled
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            # Fixed dev defaults. For production, prefer a managed database and set `DATABASE_URL`.
            POSTGRES_USER: bears
            POSTGRES_PASSWORD: bears
            POSTGRES_DB: den
        volumes:
            - bears-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bears -d den"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s

    # Optional derived recall vector store (ADR-0038). Enable with `COMPOSE_PROFILES=recall`.
    # Den defaults to `QDRANT_URL=http://bears-qdrant<suffix>:<QDRANT_PORT>` and degrades to keyword
    # (`LIKE`) recall when Qdrant is absent or unreachable, so it stays optional and nothing
    # `depends_on` it. No healthcheck: the Qdrant image ships no shell HTTP client; operators
    # add external reachability monitors (see docs/guides/infrastructure-and-ops.md).
    bears-qdrant:
        hostname: bears-qdrant${BEARS_INSTANCE_SUFFIX:-}
        networks:
            default:
                aliases:
                    - bears-qdrant${BEARS_INSTANCE_SUFFIX:-}
        profiles:
            - recall
        image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
        restart: unless-stopped
        environment:
            QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
            QDRANT__SERVICE__HTTP_PORT: ${QDRANT_PORT:-6333}
        volumes:
            - bears-qdrant-data:/qdrant/storage
        expose:
            - "${QDRANT_PORT:-6333}"
            - "6334"

    bears-bifrost-valkey:
        image: ${VALKEY_IMAGE:-valkey/valkey-bundle:9.0.0}
        restart: unless-stopped
        volumes:
            - bears-bifrost-valkey-data:/data
        expose:
            - "6379"
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    bears-bifrost:
        hostname: bears-bifrost${BEARS_INSTANCE_SUFFIX:-}
        networks:
            default:
                aliases:
                    - bears-bifrost${BEARS_INSTANCE_SUFFIX:-}
        depends_on:
            <<: *preflight-depends
            bears-bifrost-valkey:
                condition: service_healthy
        build:
            context: ./services/bifrost
            dockerfile: Dockerfile
        image: ${BIFROST_IMAGE:-bears-bifrost:configured}
        restart: unless-stopped
        environment:
            APP_HOST: ${BIFROST_APP_HOST:-0.0.0.0}
            APP_PORT: ${BIFROST_APP_PORT:-8080}
            LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
            LOG_STYLE: ${BIFROST_LOG_STYLE:-json}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
            BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-SETME}
            BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
            BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
        volumes:
            - bears-bifrost-data:/app/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:$${APP_PORT:-8080}/health || exit 1",
                ]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 120s

    # Optional: `docker compose --profile volume-backup up -d` — archive per-Bear SQLite to S3-compatible storage.
    bears-den-sqlite-data-backup:
        profiles:
            - volume-backup
        image: offen/docker-volume-backup:v2
        restart: unless-stopped
        environment:
            BACKUP_CRON_EXPRESSION: ${DEN_SQLITE_VOLUME_BACKUP_CRON:-0 5 * * *}
            BACKUP_FILENAME: "bears-den-sqlite-data-%Y-%m-%dT%H-%M-%S.{{ .Extension }}"
            TZ: UTC
            AWS_S3_BUCKET_NAME: ${SCALEWAY_BACKUP_BUCKET:-}
            AWS_S3_PATH: ${SCALEWAY_BACKUP_PREFIX:-bears-stack/volumes/bears-den-sqlite-data}
            AWS_ACCESS_KEY_ID: ${SCALEWAY_ACCESS_KEY:-}
            AWS_SECRET_ACCESS_KEY: ${SCALEWAY_SECRET_KEY:-}
            AWS_ENDPOINT: ${SCALEWAY_S3_ENDPOINT:-s3.fr-par.scw.cloud}
            AWS_ENDPOINT_PROTO: https
            AWS_DEFAULT_REGION: ${SCALEWAY_REGION:-fr-par}
        volumes:
            - bears-den-sqlite-data:/backup:ro

    bears-den:
        hostname: bears-den${BEARS_INSTANCE_SUFFIX:-}
        networks:
            default:
                aliases:
                    - bears-den${BEARS_INSTANCE_SUFFIX:-}
        # No `pull_policy: build`. Coolify deploys in two phases — `docker compose
        # build` then `docker compose up -d` — from two different directories.
        # `pull_policy: build` forces `up` to recompile the image a second time
        # even though `build` already produced `bears-den:local`. Omitting it lets
        # `up` reuse the freshly built image (default pull policy reuses a present
        # local image and never rebuilds without `--build`). The `build` phase
        # always runs first, so the reused image is always current — no staleness.
        build:
            context: ./services/den
            dockerfile: Dockerfile
            args:
                SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
                CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
        image: ${DEN_IMAGE:-bears-den:${SOURCE_COMMIT:-local}}
        restart: unless-stopped
        depends_on:
            bears-den-migrate:
                condition: service_completed_successfully
            bears-bifrost:
                condition: service_healthy
        command: ["serve"]
        environment:
            BEAR_SQLITE_DATA_DIR: ${BEAR_SQLITE_DATA_DIR:-/var/lib/den/bear-sqlite}
            DATABASE_URL: ${DATABASE_URL:-SETME}
            DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
            DB_ACQUIRE_TIMEOUT_SECS: ${DB_ACQUIRE_TIMEOUT_SECS:-3}
            DB_IDLE_TIMEOUT_SECS: ${DB_IDLE_TIMEOUT_SECS:-600}
            SQLX_MIGRATE_IGNORE_MISSING: ${SQLX_MIGRATE_IGNORE_MISSING:-false}
            JWT_SECRET: ${JWT_SECRET:-SETME}
            DEN_SECRET_ENCRYPTION_KEY: ${DEN_SECRET_ENCRYPTION_KEY:-}
            RUN_WEB: ${RUN_WEB:-true}
            RUN_API: ${RUN_API:-true}
            RUN_WORKERS: ${RUN_WORKERS:-true}
            RUN_SANDBOX: ${RUN_SANDBOX:-false}
            # Work-dispatch client settings. The default stack runs the
            # sandbox provider, so dispatch is wired up out of the box; set
            # SANDBOX_SERVER_URL= (empty) to disable dispatch. The token
            # defaults must match SANDBOX_SERVICE_TOKEN on the provider —
            # setting either env var updates both sides; override it in
            # production.
            SANDBOX_PORT: ${SANDBOX_PORT:-3002}
            SANDBOX_SERVER_URL: ${SANDBOX_SERVER_URL-http://bears-sandbox-provider${BEARS_INSTANCE_SUFFIX:-}:${SANDBOX_PORT:-3002}}
            SANDBOX_SERVER_TOKEN: ${SANDBOX_SERVER_TOKEN:-${SANDBOX_SERVICE_TOKEN:-den-sandbox-default-token}}
            SANDBOX_CALLBACK_API_URL: ${SANDBOX_CALLBACK_API_URL:-http://bears-den${BEARS_INSTANCE_SUFFIX:-}:${DEN_API_PORT:-3001}}
            WORK_DISPATCH_AUTO: ${WORK_DISPATCH_AUTO:-false}
            WORK_MAX_ATTEMPTS: ${WORK_MAX_ATTEMPTS:-2}
            WORK_SANDBOX_NETWORK: ${WORK_SANDBOX_NETWORK:-restricted}
            RUST_LOG: ${RUST_LOG:-info}
            PORT: ${DEN_PORT:-3000}
            API_PORT: ${DEN_API_PORT:-3001}
            DEN_GIT_SHA_OVERRIDE: ${DEN_GIT_SHA_OVERRIDE:-${SOURCE_COMMIT:-}}
            APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Bear Den}
            APP_SLUG: ${APP_SLUG:-bears-den}
            DEN_WEB_ORIGIN: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            DEN_API_ORIGIN: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            WEB_SERVER_URL: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            API_SERVER_URL: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
            SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@bears.artificial.design}
            MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
            MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
            TEMPLATES_DIR: ${TEMPLATES_DIR:-crates/den-web/src/templates}
            BIFROST_ORIGIN: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_INSTANCE_SUFFIX:-}:${BIFROST_APP_PORT:-8080}}
            BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
            BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
            # Derived recall index (ADR-0038). QDRANT_URL empty = recall disabled (LIKE fallback);
            # the default points at the bundled recall-profile service. Embedding
            # settings pin the active platform standard and route via Bifrost /v1/embeddings.
            QDRANT_PORT: ${QDRANT_PORT:-6333}
            QDRANT_URL: ${QDRANT_URL-http://bears-qdrant${BEARS_INSTANCE_SUFFIX:-}:${QDRANT_PORT:-6333}}
            EMBEDDING_STANDARD: ${EMBEDDING_STANDARD:-bears-embed-v1}
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
            EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
            DEN_SEARCH_PROVIDER: ${DEN_SEARCH_PROVIDER:-}
            BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
            DEN_SEARCH_MAX_RESULTS: ${DEN_SEARCH_MAX_RESULTS:-5}
            S3_ENDPOINT: ${S3_ENDPOINT:-}
            S3_BUCKET: ${S3_BUCKET:-}
            S3_REGION: ${S3_REGION:-garage}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
            GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:-}
            GHCR_PACKAGES_OWNER: ${GHCR_PACKAGES_OWNER:-}
            GHCR_PACKAGES_OWNER_KIND: ${GHCR_PACKAGES_OWNER_KIND:-}
        volumes:
            - bears-den-sqlite-data:/var/lib/den/bear-sqlite
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:$${PORT:-3000}/health/ready || exit 1",
                ]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 120s
        expose:
            - "3000"
            - "3001"

    bears-den-migrate:
        build:
            context: ./services/den
            dockerfile: Dockerfile
            args:
                SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
                CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
        image: ${DEN_IMAGE:-bears-den:${SOURCE_COMMIT:-local}}
        restart: "no"
        depends_on:
            bears-preflight-config:
                condition: service_completed_successfully
            bears-preflight-den-db:
                condition: service_completed_successfully
            bears-bifrost:
                condition: service_healthy
        command: ["migrate"]
        environment:
            BEAR_SQLITE_DATA_DIR: ${BEAR_SQLITE_DATA_DIR:-/var/lib/den/bear-sqlite}
            DATABASE_URL: ${DATABASE_URL:-SETME}
            DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
            DB_ACQUIRE_TIMEOUT_SECS: ${DB_ACQUIRE_TIMEOUT_SECS:-3}
            DB_IDLE_TIMEOUT_SECS: ${DB_IDLE_TIMEOUT_SECS:-600}
            SQLX_MIGRATE_IGNORE_MISSING: ${SQLX_MIGRATE_IGNORE_MISSING:-false}
            JWT_SECRET: ${JWT_SECRET:-SETME}
            DEN_SECRET_ENCRYPTION_KEY: ${DEN_SECRET_ENCRYPTION_KEY:-}
            RUN_WEB: ${RUN_WEB:-true}
            RUN_API: ${RUN_API:-true}
            RUN_WORKERS: ${RUN_WORKERS:-true}
            RUN_SANDBOX: ${RUN_SANDBOX:-false}
            # Work-dispatch client settings. The default stack runs the
            # sandbox provider, so dispatch is wired up out of the box; set
            # SANDBOX_SERVER_URL= (empty) to disable dispatch. The token
            # defaults must match SANDBOX_SERVICE_TOKEN on the provider —
            # setting either env var updates both sides; override it in
            # production.
            SANDBOX_PORT: ${SANDBOX_PORT:-3002}
            SANDBOX_SERVER_URL: ${SANDBOX_SERVER_URL-http://bears-sandbox-provider${BEARS_INSTANCE_SUFFIX:-}:${SANDBOX_PORT:-3002}}
            SANDBOX_SERVER_TOKEN: ${SANDBOX_SERVER_TOKEN:-${SANDBOX_SERVICE_TOKEN:-den-sandbox-default-token}}
            SANDBOX_CALLBACK_API_URL: ${SANDBOX_CALLBACK_API_URL:-http://bears-den${BEARS_INSTANCE_SUFFIX:-}:${DEN_API_PORT:-3001}}
            WORK_DISPATCH_AUTO: ${WORK_DISPATCH_AUTO:-false}
            WORK_MAX_ATTEMPTS: ${WORK_MAX_ATTEMPTS:-2}
            WORK_SANDBOX_NETWORK: ${WORK_SANDBOX_NETWORK:-restricted}
            RUST_LOG: ${RUST_LOG:-info}
            PORT: ${DEN_PORT:-3000}
            API_PORT: ${DEN_API_PORT:-3001}
            DEN_GIT_SHA_OVERRIDE: ${DEN_GIT_SHA_OVERRIDE:-${SOURCE_COMMIT:-}}
            APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Bear Den}
            APP_SLUG: ${APP_SLUG:-bears-den}
            DEN_WEB_ORIGIN: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            DEN_API_ORIGIN: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            WEB_SERVER_URL: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            API_SERVER_URL: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
            SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@bears.artificial.design}
            MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
            MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
            TEMPLATES_DIR: ${TEMPLATES_DIR:-crates/den-web/src/templates}
            BIFROST_ORIGIN: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_INSTANCE_SUFFIX:-}:${BIFROST_APP_PORT:-8080}}
            BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
            BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
            QDRANT_PORT: ${QDRANT_PORT:-6333}
            QDRANT_URL: ${QDRANT_URL-http://bears-qdrant${BEARS_INSTANCE_SUFFIX:-}:${QDRANT_PORT:-6333}}
            EMBEDDING_STANDARD: ${EMBEDDING_STANDARD:-bears-embed-v1}
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
            EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
            DEN_SEARCH_PROVIDER: ${DEN_SEARCH_PROVIDER:-}
            BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
            DEN_SEARCH_MAX_RESULTS: ${DEN_SEARCH_MAX_RESULTS:-5}
            S3_ENDPOINT: ${S3_ENDPOINT:-}
            S3_BUCKET: ${S3_BUCKET:-}
            S3_REGION: ${S3_REGION:-garage}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
            GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:-}
            GHCR_PACKAGES_OWNER: ${GHCR_PACKAGES_OWNER:-}
            GHCR_PACKAGES_OWNER_KIND: ${GHCR_PACKAGES_OWNER_KIND:-}

    # Work sandboxes (part of the default stack): two services — the provider
    # manages, the engine executes. Sandboxes never touch the host docker
    # daemon; everything sandbox-shaped (containers, relays, internal
    # networks, images, disk) lives inside bears-sandbox-engine and is
    # removed with the project. The Den workers reach the provider via
    # SANDBOX_SERVER_URL (default http://bears-sandbox-provider<suffix>:3002) with
    # SANDBOX_CALLBACK_API_URL=http://bears-den<suffix>:3001 (http: required by the
    # default restricted network mode).
    #
    # Sandbox images must exist inside the ENGINE's store: reference
    # registry-published images in the Den-managed catalog (pulled on first
    # use), build them from the /admin/sandbox web UI, or build them with
    # `docker compose --profile sandbox-build run --rm bears-sandbox-images`.

    # The Docker Engine that hosts sandbox containers. `privileged` is what
    # dind requires; it is root over its own world only — the host daemon and
    # host filesystem stay out of reach (this replaces the previous
    # host-root-equivalent docker.sock mount).
    bears-sandbox-engine:
        hostname: bears-sandbox-engine${BEARS_INSTANCE_SUFFIX:-}
        networks:
            default:
                aliases:
                    - bears-sandbox-engine${BEARS_INSTANCE_SUFFIX:-}
        image: ${SANDBOX_ENGINE_IMAGE:-docker:27-dind}
        restart: unless-stopped
        privileged: true
        environment:
            DOCKER_TLS_CERTDIR: /certs
            DOCKER_TLS_SAN: DNS:bears-sandbox-engine${BEARS_INSTANCE_SUFFIX:-}
        volumes:
            - bears-sandbox-engine-data:/var/lib/docker
            - bears-sandbox-certs:/certs
            # Same path as in the provider: the engine resolves sandbox
            # bind-mount sources, so the shared workspaces volume must appear
            # at an identical path in both services.
            - bears-sandbox-workspaces:/var/lib/bears/sandbox-workspaces
        healthcheck:
            test: ["CMD-SHELL", "docker info >/dev/null 2>&1"]
            interval: 15s
            timeout: 10s
            retries: 10
            start_period: 30s
        expose:
            - "2376"

    # Sandbox provider (RUN_SANDBOX only, no database): the Den binary plus a
    # docker CLI, talking to the engine over TLS TCP.
    bears-sandbox-provider:
        hostname: bears-sandbox-provider${BEARS_INSTANCE_SUFFIX:-}
        networks:
            default:
                aliases:
                    - bears-sandbox-provider${BEARS_INSTANCE_SUFFIX:-}
        build:
            context: ./services/den
            dockerfile: Dockerfile
            target: sandbox-provider
            args:
                SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
                CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
        image: ${SANDBOX_PROVIDER_IMAGE:-bears-sandbox-provider:${SOURCE_COMMIT:-local}}
        restart: unless-stopped
        depends_on:
            bears-preflight-config:
                condition: service_completed_successfully
            bears-sandbox-engine:
                condition: service_healthy
        command: ["serve"]
        environment:
            RUN_WEB: "false"
            RUN_API: "false"
            RUN_WORKERS: "false"
            RUN_SANDBOX: "true"
            RUST_LOG: ${RUST_LOG:-info}
            DOCKER_HOST: tcp://bears-sandbox-engine${BEARS_INSTANCE_SUFFIX:-}:2376
            DOCKER_TLS_VERIFY: "1"
            DOCKER_CERT_PATH: /certs/client
            SANDBOX_PORT: ${SANDBOX_PORT:-3002}
            # Must match SANDBOX_SERVER_TOKEN on bears-den; setting either
            # env var updates both sides. Override the default in production.
            SANDBOX_SERVICE_TOKEN: ${SANDBOX_SERVICE_TOKEN:-${SANDBOX_SERVER_TOKEN:-den-sandbox-default-token}}
            # Shared volume mounted at the same path in provider and engine,
            # so bind sources resolve without host-path mapping.
            SANDBOX_WORKSPACES_DIR: /var/lib/bears/sandbox-workspaces
            SANDBOX_IMAGE: ${SANDBOX_IMAGE:-bears/sandbox:latest}
            SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
            SANDBOX_DEFAULT_TIMEOUT_SECS: ${SANDBOX_DEFAULT_TIMEOUT_SECS:-900}
            SANDBOX_MAX_LOG_BYTES: ${SANDBOX_MAX_LOG_BYTES:-2097152}
            # One-click image builds from /admin/sandbox build the shipped
            # Dockerfile variants out of this read-only mount.
            SANDBOX_BUILD_CONTEXT_DIR: /opt/bears/sandbox-build
        volumes:
            - bears-sandbox-certs:/certs:ro
            # Also holds the persisted Den-managed config (surfaces + image
            # catalog, synced from Den; manage them in the web UI).
            - bears-sandbox-workspaces:/var/lib/bears/sandbox-workspaces
            # Shipped sandbox-image build context. The variants live outside
            # the provider's own build context (services/den); the docker CLI
            # tars these provider-side and ships them to the engine. The base
            # Dockerfile COPYs tools/bear-armature from the context root.
            - ./packaging/sandbox-image:/opt/bears/sandbox-build/packaging/sandbox-image:ro
            - ./tools/bear-armature:/opt/bears/sandbox-build/tools/bear-armature:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:$${SANDBOX_PORT:-3002}/sandbox/v1/health || exit 1",
                ]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 30s
        expose:
            - "${SANDBOX_PORT:-3002}"

    # One-shot builder: compiles the sandbox images INTO the engine's store
    # (dev / air-gapped alternative to registry-published catalog images).
    # Run manually: `docker compose --profile sandbox-build run --rm bears-sandbox-images`
    bears-sandbox-images:
        image: ${SANDBOX_CLI_IMAGE:-docker:27-cli}
        restart: "no"
        profiles: ["sandbox-build"]
        depends_on:
            bears-sandbox-engine:
                condition: service_healthy
        environment:
            DOCKER_HOST: tcp://bears-sandbox-engine${BEARS_INSTANCE_SUFFIX:-}:2376
            DOCKER_TLS_VERIFY: "1"
            DOCKER_CERT_PATH: /certs/client
        working_dir: /src
        entrypoint:
            [
                "/bin/sh",
                "-c",
                "apk add --no-cache bash git >/dev/null && bash scripts/build-sandbox-image.sh all",
            ]
        volumes:
            - bears-sandbox-certs:/certs:ro
            - .:/src:ro

volumes:
    bears-postgres-data:
    bears-den-sqlite-data:
    bears-qdrant-data:
    bears-bifrost-valkey-data:
    bears-bifrost-data:
    bears-sandbox-engine-data:
    bears-sandbox-certs:
    bears-sandbox-workspaces:
