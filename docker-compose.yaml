# Bear Den stack — single Docker Compose project with one shared network (`bears-stack`).
#
# Recommended for Coolify: Add Resource → Docker Compose → this repository,
# Base Directory: `.` (repo root), Compose file: `docker-compose.yaml`.
#
# Default stack: `bears-bifrost`, `bears-den`, optional `bears-postgres` (profile `bundled`).
# The Den-native in-process agent loop and per-Bear SQLite (`BEAR_SQLITE_DATA_DIR` /
# `bears-den-sqlite-data`) are the only runtime; Letta/Codepool/MemFS have been removed.
#
# PostgreSQL: set **`DATABASE_URL`** for `bears-den` (managed DB — preferred in Coolify).
# Optional bundled Den Postgres: `COMPOSE_PROFILES=bundled` then `docker compose --profile bundled up -d`.
#
# Shared-network deployments (for example Coolify projects connected to the same
# predefined Docker network) should set `BEARS_STAGE_SUFFIX` to a short unique
# suffix such as `-prod` or `-test`. Compose then gives each service a
# stage-specific DNS alias like `bears-bifrost-test`, and Den derives all internal
# Bifrost URLs from that one staged origin.
#
# See docs/deployment/DEPLOYMENT.md and per-service COOLIFY_DEPLOY.md files.
#
# **Preflight** services run once at deploy time and validate config before other services start
# (`depends_on` + `service_completed_successfully`). Requires Docker Compose **v2.20+**.
# Run manually: `docker compose run --rm bears-preflight-config`.

name: bears-stack

x-preflight-build: &preflight-build
    context: .
    dockerfile: services/preflight/Dockerfile

x-preflight-environment: &preflight-environment
    BIFROST_CONFIG_PATH: /app/bifrost/config.json
    JWT_SECRET: ${JWT_SECRET:-SETME}
    DEN_SECRET_ENCRYPTION_KEY: ${DEN_SECRET_ENCRYPTION_KEY:-SETME}
    BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-SETME}
    BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
    BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
    BIFROST_ORIGIN: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}
    BIFROST_BASE_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}
    BIFROST_MANAGEMENT_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}/api
    OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
    DATABASE_URL: ${DATABASE_URL:-SETME}
    WEB_SERVER_URL: ${WEB_SERVER_URL:-${SERVICE_URL_DEN:-SETME}}
    LLM_API_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}/v1
    DEN_SEARCH_PROVIDER: ${DEN_SEARCH_PROVIDER:-}
    BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    DEN_SEARCH_MAX_RESULTS: ${DEN_SEARCH_MAX_RESULTS:-5}

x-preflight-depends: &preflight-depends
    bears-preflight-config:
        condition: service_completed_successfully
    bears-preflight-den-db:
        condition: service_completed_successfully

services:
    workspace:
        profiles:
            - dev
        build: .devcontainer
        volumes:
            - .:/workspace
            - /var/run/docker.sock:/var/run/docker.sock
        command: sleep infinity

    bears-preflight-config:
        build: *preflight-build
        restart: "no"
        command: ["config"]
        environment: *preflight-environment

    bears-preflight-den-db:
        build: *preflight-build
        restart: "no"
        depends_on:
            bears-postgres:
                condition: service_healthy
                required: false
        command: ["den-db"]
        environment: *preflight-environment

    bears-postgres:
        profiles:
            - bundled
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            # Fixed dev defaults. For production, prefer a managed database and set `DATABASE_URL`.
            POSTGRES_USER: bears
            POSTGRES_PASSWORD: bears
            POSTGRES_DB: den
        volumes:
            - bears-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U bears -d den"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            default:
                aliases:
                    - bears-postgres${BEARS_STAGE_SUFFIX:-}

    # Optional derived recall vector store (ADR-0038). Enable with `COMPOSE_PROFILES=recall`
    # and point Den at it via `QDRANT_URL=http://bears-qdrant:6333`. Den degrades to keyword
    # (`LIKE`) recall when Qdrant is absent or unreachable, so it stays optional and nothing
    # `depends_on` it. No healthcheck: the Qdrant image ships no shell HTTP client; operators
    # add external reachability monitors (see docs/guides/infrastructure-and-ops.md).
    bears-qdrant:
        profiles:
            - recall
        image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.12.4}
        restart: unless-stopped
        environment:
            QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
        volumes:
            - bears-qdrant-data:/qdrant/storage
        expose:
            - "6333"
            - "6334"
        networks:
            default:
                aliases:
                    - bears-qdrant${BEARS_STAGE_SUFFIX:-}

    bears-valkey:
        image: ${VALKEY_IMAGE:-valkey/valkey-bundle:9.0.0}
        restart: unless-stopped
        volumes:
            - bears-valkey-data:/data
        expose:
            - "6379"
        healthcheck:
            test: ["CMD", "valkey-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            default:
                aliases:
                    - bears-valkey${BEARS_STAGE_SUFFIX:-}

    bears-bifrost:
        depends_on:
            <<: *preflight-depends
            bears-valkey:
                condition: service_healthy
        build:
            context: ./services/bifrost
            dockerfile: Dockerfile
        image: ${BIFROST_IMAGE:-bears-bifrost:configured}
        restart: unless-stopped
        environment:
            APP_HOST: ${BIFROST_APP_HOST:-0.0.0.0}
            APP_PORT: ${BIFROST_APP_PORT:-8080}
            LOG_LEVEL: ${BIFROST_LOG_LEVEL:-info}
            LOG_STYLE: ${BIFROST_LOG_STYLE:-json}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
            BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:-SETME}
            BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
            BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
        volumes:
            - bears-bifrost-data:/app/data
        networks:
            default:
                aliases:
                    - bears-bifrost${BEARS_STAGE_SUFFIX:-}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:$${APP_PORT:-8080}/health || exit 1",
                ]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 120s

    # Optional: `docker compose --profile volume-backup up -d` — archive per-Bear SQLite to S3-compatible storage.
    bears-den-sqlite-data-backup:
        profiles:
            - volume-backup
        image: offen/docker-volume-backup:v2
        restart: unless-stopped
        environment:
            BACKUP_CRON_EXPRESSION: ${DEN_SQLITE_VOLUME_BACKUP_CRON:-0 5 * * *}
            BACKUP_FILENAME: "bears-den-sqlite-data-%Y-%m-%dT%H-%M-%S.{{ .Extension }}"
            TZ: UTC
            AWS_S3_BUCKET_NAME: ${SCALEWAY_BACKUP_BUCKET:-}
            AWS_S3_PATH: ${SCALEWAY_BACKUP_PREFIX:-bears-stack/volumes/bears-den-sqlite-data}
            AWS_ACCESS_KEY_ID: ${SCALEWAY_ACCESS_KEY:-}
            AWS_SECRET_ACCESS_KEY: ${SCALEWAY_SECRET_KEY:-}
            AWS_ENDPOINT: ${SCALEWAY_S3_ENDPOINT:-s3.fr-par.scw.cloud}
            AWS_ENDPOINT_PROTO: https
            AWS_DEFAULT_REGION: ${SCALEWAY_REGION:-fr-par}
        volumes:
            - bears-den-sqlite-data:/backup:ro

    bears-den:
        # No `pull_policy: build`. Coolify deploys in two phases — `docker compose
        # build` then `docker compose up -d` — from two different directories.
        # `pull_policy: build` forces `up` to recompile the image a second time
        # even though `build` already produced `bears-den:local`. Omitting it lets
        # `up` reuse the freshly built image (default pull policy reuses a present
        # local image and never rebuilds without `--build`). The `build` phase
        # always runs first, so the reused image is always current — no staleness.
        build:
            context: ./services/den
            dockerfile: Dockerfile
            args:
                SQLX_OFFLINE: ${SQLX_OFFLINE:-true}
                CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
        image: ${DEN_IMAGE:-bears-den:${SOURCE_COMMIT:-local}}
        restart: unless-stopped
        depends_on:
            bears-bifrost:
                condition: service_healthy
        environment:
            BEAR_SQLITE_DATA_DIR: ${BEAR_SQLITE_DATA_DIR:-/var/lib/den/bear-sqlite}
            DATABASE_URL: ${DATABASE_URL:-SETME}
            DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
            DB_ACQUIRE_TIMEOUT_SECS: ${DB_ACQUIRE_TIMEOUT_SECS:-3}
            DB_IDLE_TIMEOUT_SECS: ${DB_IDLE_TIMEOUT_SECS:-600}
            SQLX_MIGRATE_IGNORE_MISSING: ${SQLX_MIGRATE_IGNORE_MISSING:-false}
            JWT_SECRET: ${JWT_SECRET:-SETME}
            DEN_SECRET_ENCRYPTION_KEY: ${DEN_SECRET_ENCRYPTION_KEY:-}
            RUN_WEB: ${RUN_WEB:-true}
            RUN_API: ${RUN_API:-true}
            RUN_WORKERS: ${RUN_WORKERS:-false}
            RUST_LOG: ${RUST_LOG:-info}
            PORT: ${DEN_PORT:-3000}
            API_PORT: ${DEN_API_PORT:-3001}
            DEN_GIT_SHA_OVERRIDE: ${DEN_GIT_SHA_OVERRIDE:-${SOURCE_COMMIT:-}}
            APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Bear Den}
            APP_SLUG: ${APP_SLUG:-bears-den}
            DEN_WEB_ORIGIN: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            DEN_API_ORIGIN: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            WEB_SERVER_URL: ${DEN_WEB_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            API_SERVER_URL: ${DEN_API_ORIGIN:-${SERVICE_URL_DEN:-SETME}}
            SESSION_COOKIE_DOMAIN: ${SESSION_COOKIE_DOMAIN:-}
            SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
            MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@bears.artificial.design}
            MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
            MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
            TEMPLATES_DIR: ${TEMPLATES_DIR:-crates/den-web/src/templates}
            BIFROST_ORIGIN: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}
            BIFROST_BASE_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}
            BIFROST_MANAGEMENT_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}/api
            BIFROST_ADMIN_USERNAME: ${BIFROST_ADMIN_USERNAME:-admin}
            BIFROST_ADMIN_PASSWORD: ${BIFROST_ADMIN_PASSWORD:-SETME}
            LLM_API_URL: ${BIFROST_ORIGIN:-http://bears-bifrost${BEARS_STAGE_SUFFIX:-}:8080}/v1
            OPENAI_API_KEY: ${OPENAI_API_KEY:-SETME}
            # Derived recall index (ADR-0038). QDRANT_URL empty = recall disabled (LIKE fallback);
            # set to http://bears-qdrant:6333 with COMPOSE_PROFILES=recall to enable. Embedding
            # settings pin the active platform standard and route via Bifrost /v1/embeddings.
            QDRANT_URL: ${QDRANT_URL:-}
            EMBEDDING_STANDARD: ${EMBEDDING_STANDARD:-bears-embed-v1}
            EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
            EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
            DEN_SEARCH_PROVIDER: ${DEN_SEARCH_PROVIDER:-}
            BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
            DEN_SEARCH_MAX_RESULTS: ${DEN_SEARCH_MAX_RESULTS:-5}
            S3_ENDPOINT: ${S3_ENDPOINT:-}
            S3_BUCKET: ${S3_BUCKET:-}
            S3_REGION: ${S3_REGION:-garage}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
            S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
            S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
            GITHUB_PACKAGES_TOKEN: ${GITHUB_PACKAGES_TOKEN:-}
            GHCR_PACKAGES_OWNER: ${GHCR_PACKAGES_OWNER:-}
            GHCR_PACKAGES_OWNER_KIND: ${GHCR_PACKAGES_OWNER_KIND:-}
        volumes:
            - bears-den-sqlite-data:/var/lib/den/bear-sqlite
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:$${PORT:-3000}/health/ready || exit 1",
                ]
            interval: 30s
            timeout: 15s
            retries: 5
            start_period: 120s
        expose:
            - "3000"
            - "3001"
        networks:
            default:
                aliases:
                    - bears-den${BEARS_STAGE_SUFFIX:-}

volumes:
    bears-postgres-data:
    bears-den-sqlite-data:
    bears-qdrant-data:
    bears-valkey-data:
    bears-bifrost-data:
