name: Sandbox images – publish to GHCR

# Publishes the work-sandbox container images the sandbox engine pulls:
# the base headless-armature image plus the toolchain variants. Reference
# these in the provider's roots-file `images` catalog, e.g.
# ghcr.io/<owner>/bears-sandbox-rust:latest. (Dev alternative: build them
# directly into the engine with the bears-sandbox-images compose service.)

on:
    push:
        branches: [main, test]
        paths:
            - "tools/bear-armature/**"
            - "packaging/sandbox-image/**"
            - ".github/workflows/sandbox-images.yml"
    workflow_dispatch:

env:
    REGISTRY: ghcr.io

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Set image prefix (GHCR requires lowercase)
              run: |
                  owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_PREFIX=${{ env.REGISTRY }}/${owner_lc}" >> "$GITHUB_ENV"
                  echo "SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push base image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: packaging/sandbox-image/Dockerfile
                  push: true
                  build-args: |
                      BEAR_ARMATURE_BUILD_SHA=${{ github.sha }}
                  tags: |
                      ${{ env.IMAGE_PREFIX }}/bears-sandbox:latest
                      ${{ env.IMAGE_PREFIX }}/bears-sandbox:sha-${{ env.SHORT_SHA }}
                  cache-from: type=gha,scope=sandbox-image
                  cache-to: type=gha,scope=sandbox-image,mode=max

            - name: Build and push toolchain variants
              run: |
                  set -euo pipefail
                  for variant in rust node godot; do
                    docker buildx build \
                      --file "packaging/sandbox-image/Dockerfile.${variant}" \
                      --build-arg "BASE_IMAGE=${IMAGE_PREFIX}/bears-sandbox:sha-${SHORT_SHA}" \
                      --tag "${IMAGE_PREFIX}/bears-sandbox-${variant}:latest" \
                      --tag "${IMAGE_PREFIX}/bears-sandbox-${variant}:sha-${SHORT_SHA}" \
                      --push \
                      packaging/sandbox-image
                  done
