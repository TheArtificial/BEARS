name: Coolify deploy

on:
    push:
        branches: [main, test]
        paths:
            - "docker-compose.yaml"
            - ".github/workflows/coolify-deploy.yml"
            - "services/den/**"
            - "services/bifrost/**"
            - "services/preflight/**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: coolify-deploy-${{ github.ref_name }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Trigger Coolify deploy
        runs-on: ubuntu-24.04
        steps:
            - name: Trigger Coolify deploy
              env:
                  COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  set -euo pipefail

                  if [ -z "${COOLIFY_WEBHOOK}" ]; then
                    echo "COOLIFY_WEBHOOK is not configured."
                    exit 1
                  fi

                  curl -X GET "${COOLIFY_WEBHOOK}" \
                    -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                    --fail --silent --show-error
