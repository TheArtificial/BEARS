name: Coolify deploy

on:
    workflow_run:
        workflows: ["Den – publish images"]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: coolify-deploy-${{ github.event.workflow_run.head_branch }}
    cancel-in-progress: true

jobs:
    deploy:
        name: Trigger Coolify deploy
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'test')
        runs-on: ubuntu-24.04
        environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'testing' }}
        steps:
            - name: Trigger Coolify deploy
              env:
                  COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
                  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
              run: |
                  set -euo pipefail

                  if [ -z "${COOLIFY_WEBHOOK}" ]; then
                    echo "COOLIFY_WEBHOOK is not configured."
                    exit 1
                  fi

                  headers=()
                  if [ -n "${COOLIFY_TOKEN}" ]; then
                    headers+=(-H "Authorization: Bearer ${COOLIFY_TOKEN}")
                  fi

                  curl -X POST "${COOLIFY_WEBHOOK}" \
                    "${headers[@]}" \
                    -H "Content-Type: application/json" \
                    --data '{}' \
                    --fail --silent --show-error

            - name: Verify deployment readiness and Den revision
              env:
                  BEARS_DEPLOY_URL: ${{ secrets.BEARS_DEPLOY_URL }}
                  EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  set -euo pipefail

                  if [ -z "${BEARS_DEPLOY_URL}" ]; then
                    echo "BEARS_DEPLOY_URL not set; skipping post-deploy verification."
                    exit 0
                  fi

                  base="${BEARS_DEPLOY_URL%/}"
                  echo "Waiting for ${base}/health/ready and ${base}/status.json to report git_sha=${EXPECTED_SHA}"

                  sha_matches() {
                    local deployed="$1"
                    local expected="$2"
                    [ -n "${deployed}" ] || return 1
                    [ "${deployed}" != "unknown" ] || return 1
                    [ "${deployed}" = "${expected}" ] && return 0
                    [ "${#deployed}" -ge 7 ] && [ "${expected:0:7}" = "${deployed:0:7}" ] && return 0
                    return 1
                  }

                  for attempt in $(seq 1 90); do
                    if curl -fsS "${base}/health/ready" >/dev/null 2>&1 && body="$(curl -fsS "${base}/status.json" 2>/dev/null)"; then
                      deployed="$(printf '%s' "${body}" | jq -r '.den_version.git_sha // empty')"
                      if sha_matches "${deployed}" "${EXPECTED_SHA}"; then
                        echo "Deploy verified after ${attempt} attempt(s): den git_sha=${deployed}"
                        exit 0
                      fi
                      echo "Attempt ${attempt}: live git_sha=${deployed:-<empty>} (expected ${EXPECTED_SHA})"
                    else
                      echo "Attempt ${attempt}: service is not ready yet"
                    fi
                    sleep 30
                  done

                  echo "Timed out after 45 minutes: Den never became ready with the expected git SHA."
                  exit 1
