name: Den – clippy gate

on:
    push:
        branches: [main, test, clippy]
        paths:
            - "services/den/**"
            - ".github/workflows/den-clippy.yml"
    pull_request:
        paths:
            - "services/den/**"
            - ".github/workflows/den-clippy.yml"

env:
    # The workspace ships a committed `.sqlx` query cache so clippy can compile
    # sqlx macros without a live database.
    SQLX_OFFLINE: "true"
    CARGO_TERM_COLOR: always

jobs:
    unit-tests:
        runs-on: ubuntu-24.04-arm
        defaults:
            run:
                working-directory: services/den
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              run: rustup toolchain install stable --profile minimal

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: services/den

            - name: Run workspace unit tests
              run: cargo test --workspace --lib

    docket-lifecycle:
        runs-on: ubuntu-24.04-arm
        defaults:
            run:
                working-directory: services/den
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: den_test
                options: >-
                    --health-cmd "pg_isready -U postgres -d den_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        env:
            # The workflow default is offline for compile/lint work. Live SQLx
            # tests must connect to the service container instead.
            SQLX_OFFLINE: "false"
            DATABASE_URL: postgres://postgres:postgres@localhost:5432/den_test
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              run: rustup toolchain install stable --profile minimal

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: services/den

            - name: Run Docket lifecycle regime
              run: ./scripts/test-docket.sh all

    clippy:
        runs-on: ubuntu-24.04-arm
        defaults:
            run:
                working-directory: services/den
        steps:
            - uses: actions/checkout@v4

            # ADR-0031 write topology: one MemoryStoreManager per process. Cheap
            # grep gate — fails on MemoryStoreManager::new outside the sanctioned
            # sites listed in scripts/check-memory-write-topology.sh.
            - name: Enforce memory write topology
              run: bash ../../scripts/check-memory-write-topology.sh

            - name: Install Rust toolchain (with clippy)
              run: rustup component add clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: services/den

            - name: Verify checked SQLx metadata is current
              run: |
                  ../../scripts/sqlx.sh migrate run
                  ../../scripts/sqlx.sh prepare --check --workspace -- --all-targets

            # v2 gate (DEN_CRATE_SPLIT_PLAN.md): the default lint set plus clippy
            # pedantic/nursery (set to `deny` in `[workspace.lints.clippy]` with a
            # curated allow-list) are enforced. `-D warnings` fails the build on any
            # remaining non-allow-listed lint.
            - name: Clippy (-D warnings, pedantic + nursery gating)
              run: cargo clippy --workspace --all-targets -- -D warnings
