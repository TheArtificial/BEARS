name: Den – publish images

on:
    push:
        branches: [main, test]
        paths:
            - "services/den/**"
            - "packaging/sandbox-image/**"
            - "tools/bear-armature/**"
            - ".github/workflows/den-image.yml"
    workflow_dispatch:

concurrency:
    group: den-image-${{ github.ref_name }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    # The current Coolify host is x86_64. Keep this explicit so a wrong-platform
    # image cannot reach the deployment webhook.
    DEPLOY_PLATFORM: linux/amd64
    # Image names are set in each job because GHCR requires lowercase repository paths.

permissions:
    contents: read
    packages: write

jobs:
    sqlx-offline-preflight:
        name: Verify Den SQLx offline build
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: services/den
        env:
            SQLX_OFFLINE: "true"
        steps:
            - uses: actions/checkout@v4

            # Intentionally do not restore `target/`: this must compile the checked-in
            # .sqlx metadata, not inherit a previous image build's artifacts.
            - name: Compile production workspace with checked-in SQLx metadata
              run: cargo build --locked --release --features=production --message-format=short

    build-and-push-den:
        name: Build and push Den
        needs: sqlx-offline-preflight
        runs-on: ubuntu-24.04
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v4

            - name: Set image name (GHCR requires lowercase)
              run: |
                  owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_NAME=${owner_lc}/den" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3
              id: buildx

            - name: Restore Cargo BuildKit cache mounts
              id: cargo-cache-mount
              uses: actions/cache@v4
              with:
                  path: .docker-cache/den-cargo-mounts
                  key: den-cargo-mounts-linux-amd64-${{ github.ref_name }}-${{ hashFiles('services/den/Cargo.lock') }}-${{ github.sha }}
                  restore-keys: |
                      den-cargo-mounts-linux-amd64-${{ github.ref_name }}-${{ hashFiles('services/den/Cargo.lock') }}-
                      den-cargo-mounts-linux-amd64-main-${{ hashFiles('services/den/Cargo.lock') }}-

            - name: Inject Cargo BuildKit cache mounts
              uses: reproducible-containers/buildkit-cache-dance@v3
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  cache-dir: .docker-cache/den-cargo-mounts
                  dockerfile: services/den/Dockerfile
                  skip-extraction: ${{ steps.cargo-cache-mount.outputs.cache-hit }}

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,format=short,prefix=sha-
                      type=raw,value=testing,enable=${{ github.ref_name == 'test' }}
                      type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

            - name: Build and push Den
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: services/den
                  file: services/den/Dockerfile
                  push: true
                  platforms: ${{ env.DEPLOY_PLATFORM }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SQLX_OFFLINE=true
                      GIT_SHA=${{ github.sha }}
                  # GHA cache alone often misses or evicts large Rust layers; registry
                  # cache persists dependency compile layers on GHCR alongside the app image.
                  cache-from: |
                      type=gha,scope=den-image
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: |
                      type=gha,scope=den-image,mode=max,ignore-error=true
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    build-and-push-sandbox-provider:
        name: Build and push Den sandbox provider
        needs: build-and-push-den
        runs-on: ubuntu-24.04
        outputs:
            digest: ${{ steps.build.outputs.digest }}
        steps:
            - uses: actions/checkout@v4

            - name: Set image name (GHCR requires lowercase)
              run: |
                  owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_NAME=${owner_lc}/den-sandbox-provider" >> "$GITHUB_ENV"
                  echo "DEN_IMAGE_NAME=${owner_lc}/den" >> "$GITHUB_ENV"

            - uses: docker/setup-buildx-action@v3
              id: buildx

            - name: Restore Cargo BuildKit cache mounts
              id: cargo-cache-mount
              uses: actions/cache@v4
              with:
                  path: .docker-cache/den-cargo-mounts
                  key: den-cargo-mounts-linux-amd64-${{ github.ref_name }}-${{ hashFiles('services/den/Cargo.lock') }}-${{ github.sha }}
                  restore-keys: |
                      den-cargo-mounts-linux-amd64-${{ github.ref_name }}-${{ hashFiles('services/den/Cargo.lock') }}-
                      den-cargo-mounts-linux-amd64-main-${{ hashFiles('services/den/Cargo.lock') }}-

            - name: Inject Cargo BuildKit cache mounts
              uses: reproducible-containers/buildkit-cache-dance@v3
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  cache-dir: .docker-cache/den-cargo-mounts
                  dockerfile: services/den/Dockerfile
                  skip-extraction: ${{ steps.cargo-cache-mount.outputs.cache-hit }}

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,format=short,prefix=sha-
                      type=raw,value=testing,enable=${{ github.ref_name == 'test' }}
                      type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

            - name: Build and push Den sandbox provider
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: services/den
                  file: services/den/Dockerfile
                  target: sandbox-provider
                  build-contexts: |
                      sandbox_packaging=./packaging/sandbox-image
                      bear_armature=./tools/bear-armature
                  push: true
                  platforms: ${{ env.DEPLOY_PLATFORM }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SQLX_OFFLINE=true
                      GIT_SHA=${{ github.sha }}
                  # Reuse the standard Den build stage from this commit before
                  # consulting the provider-specific cache. This avoids compiling
                  # the same Rust binary twice for one workflow run.
                  cache-from: |
                      type=gha,scope=den-image
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.DEN_IMAGE_NAME }}:buildcache
                      type=gha,scope=den-sandbox-provider-image
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: |
                      type=gha,scope=den-sandbox-provider-image,mode=max,ignore-error=true
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

    verify-deployable-images:
        name: Verify deployable image availability
        needs: [build-and-push-den, build-and-push-sandbox-provider]
        runs-on: ubuntu-24.04
        steps:
            - name: Set lane image references
              run: |
                  owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  case "${{ github.ref_name }}" in
                    test) lane=testing ;;
                    main) lane=latest ;;
                    *) echo "Unsupported deployment branch: ${{ github.ref_name }}" >&2; exit 1 ;;
                  esac
                  echo "DEN_IMAGE=${{ env.REGISTRY }}/${owner_lc}/den:${lane}" >> "$GITHUB_ENV"
                  echo "SANDBOX_PROVIDER_IMAGE=${{ env.REGISTRY }}/${owner_lc}/den-sandbox-provider:${lane}" >> "$GITHUB_ENV"

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Pull and verify deployment images
              run: |
                  set -euo pipefail
                  for image in "${DEN_IMAGE}" "${SANDBOX_PROVIDER_IMAGE}"; do
                    echo "Waiting for ${image} to be available as ${DEPLOY_PLATFORM}..."
                    for attempt in $(seq 1 12); do
                      if docker pull "${image}"; then
                        actual=$(docker image inspect "${image}" --format '{{.Os}}/{{.Architecture}}')
                        if [ "${actual}" = "${DEPLOY_PLATFORM}" ]; then
                          echo "Verified ${image}: ${actual}"
                          break
                        fi
                        echo "${image} resolved to ${actual}, expected ${DEPLOY_PLATFORM}" >&2
                        exit 1
                      fi
                      if [ "${attempt}" = "12" ]; then
                        echo "${image} was not available after 12 attempts" >&2
                        exit 1
                      fi
                      sleep 10
                    done
                  done
