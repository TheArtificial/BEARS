name: Den – publish versioned image

on:
    push:
        branches: [main, test]
        paths:
            - "services/den/Cargo.toml"
            - ".github/workflows/den-image.yml"

env:
    REGISTRY: ghcr.io
    # IMAGE_NAME is set in the job (GHCR / buildx require lowercase repository paths).

permissions:
    contents: read
    packages: write

jobs:
    build-and-push:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set image name (GHCR requires lowercase)
              run: |
                  owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
                  echo "IMAGE_NAME=${owner_lc}/den" >> "$GITHUB_ENV"

            - name: Check Den crate version
              id: version
              env:
                  BEFORE: ${{ github.event.before }}
                  EVENT_NAME: ${{ github.event_name }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  set -euo pipefail

                  version=$(awk -F '"' '
                    $0 == "[package]" { in_package=1; next }
                    /^\[/ && $0 != "[package]" { in_package=0 }
                    in_package && $1 ~ /^version[[:space:]]*=/ { print $2; exit }
                  ' services/den/Cargo.toml)

                  if [ -z "${version}" ]; then
                    echo "Could not read package.version from services/den/Cargo.toml" >&2
                    exit 1
                  fi

                  changed=true
                  if [ "${EVENT_NAME}" = "push" ]; then
                    compare_ref="${BEFORE}"
                    if [ -z "${compare_ref}" ] || [ "${compare_ref}" = "0000000000000000000000000000000000000000" ]; then
                      compare_ref="origin/${DEFAULT_BRANCH}"
                    fi
                    previous=$(git show "${compare_ref}:services/den/Cargo.toml" 2>/dev/null | awk -F '"' '
                      $0 == "[package]" { in_package=1; next }
                      /^\[/ && $0 != "[package]" { in_package=0 }
                      in_package && $1 ~ /^version[[:space:]]*=/ { print $2; exit }
                    ' || true)
                    if [ "${previous}" = "${version}" ]; then
                      changed=false
                    fi
                    echo "previous=${previous}" >> "$GITHUB_OUTPUT"
                  fi

                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "changed=${changed}" >> "$GITHUB_OUTPUT"
                  echo "Den crate version: ${version}; changed=${changed}"

            - uses: docker/setup-buildx-action@v3
              if: steps.version.outputs.changed == 'true'

            - name: Log in to GHCR
              if: steps.version.outputs.changed == 'true'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              if: steps.version.outputs.changed == 'true'
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,prefix=
                      type=raw,value=${{ steps.version.outputs.version }}
                      type=raw,value=v${{ steps.version.outputs.version }}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push
              if: steps.version.outputs.changed == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: services/den
                  push: true
                  platforms: linux/arm64
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      SQLX_OFFLINE=true
                      GIT_SHA=${{ github.sha }}
                  # GHA cache alone often misses or evicts large Rust layers; registry
                  # cache persists dependency compile layers on GHCR alongside the app image.
                  cache-from: |
                      type=gha,scope=den-image
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
                  cache-to: |
                      type=gha,scope=den-image,mode=max,ignore-error=true
                      type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
