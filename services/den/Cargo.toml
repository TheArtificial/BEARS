[package]
name = "den"
version = "0.1.0"
edition = "2021"

[features]
production = []
web-ui-fixtures = []

# Cargo workspace root. The `den` binary stays the root package; extracted
# member crates (den-core, den-llm, ...) land under `crates/` per
# docs/roadmap/DEN_CRATE_SPLIT_PLAN.md. Members are added as they are extracted.
[workspace]
resolver = "2"
members = ["crates/den-core", "crates/den-llm", "crates/den-memory", "crates/den-docket", "crates/den-tools"]

[lints]
workspace = true

# Advisory clippy baseline (DEN_CRATE_SPLIT_PLAN.md v1: pedantic/nursery are
# advisory `warn`, not gating, with the noisy lints allow-listed). Gating
# (`-D warnings`) is promoted in v2.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Noisy / low-signal pedantic lints.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
similar_names = "allow"
if_not_else = "allow"
single_match_else = "allow"
match_same_arms = "allow"
unnested_or_patterns = "allow"
redundant_closure_for_method_calls = "allow"
map_unwrap_or = "allow"
uninlined_format_args = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Noisy / false-positive-prone nursery lints.
option_if_let_else = "allow"
missing_const_for_fn = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"
use_self = "allow"
cognitive_complexity = "allow"
branches_sharing_code = "allow"

[profile.dev]
# Optimize for faster linking in development
debug = 1          # Reduce debug info (0 = none, 1 = line tables, 2 = full)
incremental = true # Enable incremental compilation
codegen-units = 256 # More codegen units = faster compile, slower runtime

[profile.dev.package.sqlx-macros]
opt-level = 0

# Optimize heavy dependencies in debug builds to reduce binary size
[profile.dev.package."*"]
opt-level = 1      # Light optimization for all dependencies
debug = 0          # No debug symbols for dependencies

# Keep our own code unoptimized for debugging
[profile.dev.package.den]
opt-level = 0
debug = 2

# Fast development profile for even quicker iteration
[profile.dev-fast]
inherits = "dev"
debug = 0          # No debug info at all
opt-level = 0      # No optimization
incremental = true
codegen-units = 256

[profile.release]
# Optimize for reasonable binary speed while keeping link times practical.
# Local Docker smoke builds run on memory-constrained developer machines, so keep
# the default release profile conservative enough that the final Den crate build
# does not OOM. CI/deploy can still opt into the smaller/faster runtime profile
# below with `--profile release-lto`.
lto = false
codegen-units = 256
panic = "abort"
strip = "symbols"
debug = 0

[profile.release-lto]
inherits = "release"
lto = "thin"
codegen-units = 16

[dependencies]
den-core = { path = "crates/den-core" }
den-llm = { path = "crates/den-llm" }
den-memory = { path = "crates/den-memory" }
den-docket = { path = "crates/den-docket" }
den-tools = { path = "crates/den-tools" }
utoipa = { version = "4.0", features = ["axum_extras"] }
anyhow = "1.0"
async-trait = "0.1.86"
axum = { version = "0.8", default-features = false, features = ["json", "http1", "matched-path", "tokio", "macros"] }
axum-extra = { version = "0.10.0", features = ["form", "query"] }
axum-login = "0.17.0"
# tower-sessions-postgres-store = "0.1.1"
# tower-sessions-moka-store = "0.15.0"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "time", "json", "uuid"] }
futures = "0.3"
minijinja = { version = "2.5.0", features = ["loader", "preserve_order", "json"] }
# minijinja-autoreload = "2.5.0"  # Only needed in development
minijinja-contrib = { version = "2.6.0", features = ["datetime", "timezone"] }
password-auth = "1.0.0"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.12"
time = { version = "0.3.37", features = ["serde", "serde-well-known"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "^0.7", default-features = false }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "cors"] }
# tower-livereload = "0.9"  # Commented out - not currently used
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# OpenTelemetry removed - using lightweight tracing only
# tracing-opentelemetry = "0.30.0"
# opentelemetry = { version = "0.29.1", features = ["trace", "metrics"] }
# opentelemetry-otlp = { version = "0.29.0", features = ["grpc-tonic", "reqwest-client", "tls-roots"] }
# opentelemetry_sdk = "0.29.0"
validator = { version = "0.20", features = ["derive"] }
serde_json = "1.0.138"
uuid = { version = "1", features = ["serde", "v4"] }
dotenvy = "0.15.7"
minijinja-embed = "2.7.0"
memory-serve = "1.2.2"
url = "2.5.4"
rand = "0.9.1"
regex = "1.11.1"
indexmap = { version = "2.9.0", features = ["serde"] }
mailgun-rs = "2.0.1"
urlencoding = "2.1"
ammonia = "4.1.1"
pulldown-cmark = "0.13.0"
jsonwebtoken = "9.3.0"
sha2 = "0.10"
base64 = "0.22"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusty-s3 = "0.8"

[dev-dependencies]
den-core = { path = "crates/den-core", features = ["test-util"] }
serde_json = "1.0.138"
http-body-util = "0.1"
minijinja-autoreload = "2.5.0"  # Development-only template reloading
tower = { version = "0.5.2", features = ["util"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }

[build-dependencies]
minijinja-embed = "2.7.0"
time = { version = "0.3.37", features = ["formatting"] }
