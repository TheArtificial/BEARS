[package]
name = "den-bearwire"
version.workspace = true
edition = "2021"

# den-bearwire: BearWire v1 HTTP/SSE edge for trusted armatures. This is the
# future Den ↔ armature protocol boundary; ACP-specific translation stays in the
# armature and legacy `den-acp` during migration.

[lints]
workspace = true

[features]
production = ["den-core/production", "den-runtime/production", "den-http/production"]

[dependencies]
den-core = { path = "../den-core" }
den-http = { path = "../den-http" }
den-runtime = { path = "../den-runtime" }
axum = { version = "0.8", default-features = false, features = ["json", "http1", "matched-path", "tokio", "macros"] }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
