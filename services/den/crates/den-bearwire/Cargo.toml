[package]
name = "den-bearwire"
version.workspace = true
edition = "2021"

# den-bearwire: BearWire v1 HTTP/SSE edge for trusted armatures. This is the
# future Den ↔ armature protocol boundary; ACP-specific translation stays in the
# armature and legacy `den-acp` during migration.

[lints]
workspace = true

[features]
production = ["den-core/production", "den-protocol/production", "den-service/production", "den-runtime/production", "den-http/production"]

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-service = { path = "../den-service" }
den-llm = { path = "../den-llm" }
den-http = { path = "../den-http" }
den-runtime = { path = "../den-runtime" }
axum = { workspace = true, features = ["json", "query"] }
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
