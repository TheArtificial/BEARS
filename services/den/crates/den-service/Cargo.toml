[package]
name = "den-service"
version.workspace = true
edition = "2021"

# Shared concrete application/service state for Den HTTP edges.
# This crate intentionally sits below den-runtime: app state, Bifrost metadata,
# and process-local turn coordination live here; runtime execution remains in
# den-runtime.

[lints]
workspace = true

[features]
production = ["den-core/production", "den-protocol/production"]
test-util = ["den-core/test-util"]

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-llm = { path = "../den-llm" }
den-memory = { path = "../den-memory" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "sqlite", "time", "json", "uuid", "macros"] }
time = { version = "0.3.37", features = ["serde", "serde-well-known"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
tracing = "0.1.41"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
