[package]
name = "den-llm"
version = "0.1.0"
edition = "2021"

# OpenAI-compatible streaming inference client (Bifrost / LLM_API_URL).
# Stable leaf in the den workspace (DEN_CRATE_SPLIT_PLAN.md): depends only on
# den-core. Runtime-event mapping (SSE -> RuntimeStreamEvent) deliberately
# stays in den-runtime to avoid a llm -> runtime cycle.

[lints]
workspace = true

[dependencies]
den-core = { path = "../den-core" }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
bytes = "1"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time", "sync"] }
tracing = "0.1.41"

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
