[package]
name = "den-protocol"
version.workspace = true
edition = "2021"

# Stable protocol/data contracts shared by runtime implementations and edge crates.
# Keep this crate light: DTOs, event enums, request/response contracts, and small
# classification helpers only. No concrete app state or runtime execution logic.

[lints]
workspace = true

[features]
production = ["den-core/production"]

[dependencies]
den-core = { path = "../den-core" }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
uuid = { version = "1", features = ["serde", "v4"] }
