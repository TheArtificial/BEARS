[package]
name = "den-protocol"
version.workspace = true
edition = "2021"

# Stable protocol/data contracts shared by runtime implementations and edge crates.
# Keep this crate light: DTOs, event enums, request/response contracts, and small
# classification helpers only. No concrete app state or runtime execution logic.

[lints]
workspace = true

[features]
default = ["runtime-api"]
runtime-api = ["bytes", "den-core", "futures"]
production = ["runtime-api", "den-core/production"]

[dependencies]
den-core = { path = "../den-core", optional = true }
bytes = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
