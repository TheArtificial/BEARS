[package]
name = "den-runtime"
version.workspace = true
edition = "2021"

# den-runtime: the native agent runtime (DEN_CRATE_SPLIT_PLAN.md v1.4). It owns the
# agent loop, native provider/runtime, governance, bears provisioning, conversation
# storage, reflection, and the runtime-side memory/llm glue. It consumes the tool
# surface (`den_core::tools`) and the `den-docket`/`den-memory`/`den-llm` leaves, so
# the edges (acp/api/web) and the thin `den` binary depend on it, not the reverse.
# Modules are moved in incrementally; see the v1.4 extraction order in the roadmap.

[lints]
workspace = true

[features]
production = ["den-core/production"]
# Exposes runtime test helpers (e.g. record normalizers) to downstream crates' tests.
test-util = ["den-service/test-util"]

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-service = { path = "../den-service" }
den-llm = { path = "../den-llm" }
den-memory = { path = "../den-memory" }
den-docket = { path = "../den-docket" }
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
indexmap = { version = "2.9.0", features = ["serde"] }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid"] }
thiserror.workspace = true
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
serde_json.workspace = true
