[package]
name = "den-acp"
version.workspace = true
edition = "2021"

# den-acp: the ACP (Agent Client Protocol) HTTP edge — the native ACP protocol
# surface (`acp`), the residual session/token/runtime protocol modules under
# `core::acp`, and `/internal/den-tools/invoke`. The shared `DenState` lives in
# den-runtime (ADR-0043: state is protocol-neutral); `service` re-exports it for
# path compatibility. It sits below den-api (which mounts the acp + internal
# routers) and above den-oauth (bearer auth), den-http (errors/identity),
# den-runtime (tool/runtime execution + DenState), den-docket (work plans), and
# den-core.

[lints]
workspace = true

[features]
production = ["den-core/production", "den-protocol/production", "den-service/production", "den-runtime/production", "den-http/production", "den-oauth/production"]

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-service = { path = "../den-service" }
den-docket = { path = "../den-docket" }
den-http = { path = "../den-http" }
den-oauth = { path = "../den-oauth" }
den-runtime = { path = "../den-runtime" }
axum = { workspace = true, features = ["json", "http1", "matched-path", "tokio", "macros", "query", "form"] }
axum-extra.workspace = true
base64.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "sqlite", "time", "json", "uuid", "macros"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
den-runtime = { path = "../den-runtime", features = ["test-util"] }
dotenvy.workspace = true
serde_json.workspace = true
