[package]
name = "den-http"
version.workspace = true
edition = "2021"

# den-http: the shared HTTP/identity foundation for the den binary's edge crates
# (den-web / den-api / den-acp). It owns the web-boundary error adapter
# (`errors::CustomError`, the axum `IntoResponse` over the web-free `den_core::DenError`),
# the axum-login auth backend (`auth_backend`), small request (de)serialization
# helpers (`api_utils`), and the identity layer the auth backend depends on
# (`user`, `email`). It sits just above `den-core`; the edges depend on it, not the
# reverse. Email templates are embedded here (production) / path-loaded (dev) via
# `email::template_environment`.

[lints]
workspace = true

[features]
production = ["den-core/production"]

[dependencies]
den-core = { path = "../den-core" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["json"] }
axum-login.workspace = true
base64.workspace = true
mailgun-rs = "2.0.1"
minijinja.workspace = true
minijinja-embed.workspace = true
password-auth.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid", "macros"] }
thiserror.workspace = true
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
validator.workspace = true

[build-dependencies]
minijinja-embed.workspace = true
time = { workspace = true, features = ["formatting"] }

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
