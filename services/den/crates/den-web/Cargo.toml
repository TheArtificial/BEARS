[package]
name = "den-web"
version.workspace = true
edition = "2021"

# den-web: the server-rendered web UI + `/v1/*` JSON/SSE edge of the den binary.
# It owns the MiniJinja template environment + embedded assets, the session-cookie
# UI routes (home/onboarding/admin/bear management/user settings), and the in-app
# chat surface. It sits above den-http (identity/errors/web policy/ACP tokens),
# den-oauth, den-runtime, den-docket, and den-core. Builtin Den tool execution is
# injected via `den_runtime::native_runtime::tool_invoker`, so the den-side tool
# composition stays in the binary. (den-web deliberately does NOT depend on
# den-api/den-acp, so it compiles in parallel with those edges.)

[lints]
workspace = true

[features]
production = [
    "den-core/production",
    "den-protocol/production",
        "den-service/production",
        "den-http/production",
    "den-oauth/production",
]
web-ui-fixtures = []

[dependencies]
den-core = { path = "../den-core" }
den-protocol = { path = "../den-protocol" }
den-service = { path = "../den-service" }
den-llm = { path = "../den-llm" }
den-memory = { path = "../den-memory" }
den-http = { path = "../den-http" }
den-docket = { path = "../den-docket" }
den-oauth = { path = "../den-oauth" }
ammonia = "4.1.1"
axum = { workspace = true, features = ["json", "http1", "matched-path", "tokio", "macros", "query", "form", "multipart"] }
axum-extra.workspace = true
axum-login.workspace = true
bytes.workspace = true
futures.workspace = true
indexmap = { version = "2.9.0", features = ["serde"] }
memory-serve = "1.2.2"
minijinja.workspace = true
minijinja-contrib = { version = "2.6.0", features = ["datetime", "timezone"] }
minijinja-embed.workspace = true
password-auth.workspace = true
pulldown-cmark = "0.13.0"
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusty-s3 = "0.8"
serde.workspace = true
serde_json.workspace = true
serde_yml.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "sqlite", "time", "json", "uuid", "macros"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower.workspace = true
tower-http.workspace = true
tower-sessions-sqlx-store.workspace = true
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true
uuid.workspace = true
validator.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
minijinja-embed.workspace = true

[dev-dependencies]
den-core = { path = "../den-core", features = ["test-util"] }
den-runtime = { path = "../den-runtime", features = ["test-util"] }
dotenvy.workspace = true
http-body-util = "0.1"
serde_json.workspace = true
tower = { workspace = true, features = ["util"] }
