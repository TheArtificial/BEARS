[package]
name = "den-docket"
version.workspace = true
edition = "2021"

# Docket: Den's control-plane work-management subsystem (ADR-0034).
# Service-layer leaf in the den workspace (DEN_CRATE_SPLIT_PLAN.md): depends only
# on den-core. New jobs/tasks use the relational ADR-0034 tables; legacy
# `bear_work_plans` paths remain compatibility-only task-list projection helpers.

[lints]
workspace = true

[dependencies]
den-core = { path = "../den-core" }
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid"] }
time = { workspace = true, features = ["serde", "serde-well-known"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
