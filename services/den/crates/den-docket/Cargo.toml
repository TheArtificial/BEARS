[package]
name = "den-docket"
version = "0.1.0"
edition = "2021"

# Docket: Den's control-plane work-management subsystem (ADR-0034).
# Service-layer leaf in the den workspace (DEN_CRATE_SPLIT_PLAN.md): depends only
# on den-core. Today it wraps the legacy `bear_work_plans` activity board; the
# relational jobs/tasks realization is tracked in DOCKET_IMPLEMENTATION_PLAN.md.

[lints]
workspace = true

[dependencies]
den-core = { path = "../den-core" }
async-trait = "0.1.86"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.138"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "time", "json", "uuid"] }
time = { version = "0.3.37", features = ["serde", "serde-well-known"] }
uuid = { version = "1", features = ["serde", "v4"] }
