[package]
name = "den-core"
version.workspace = true
edition = "2021"

# Foundation leaf crate for the den workspace (DEN_CRATE_SPLIT_PLAN.md):
# shared config, types, errors. Third-party deps only; depends on no other
# den crate.

[features]
# Exposes test-only constructors (e.g. `Config::test_stub`) to dependent
# crates' test builds.
test-util = []
# Production hardening toggles (mirrors the `den` binary's `production` feature,
# which enables it here). Gates stricter config defaults in `config.rs`.
production = []

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "time", "json", "uuid"] }
time = { workspace = true, features = ["formatting", "serde", "serde-well-known"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true
